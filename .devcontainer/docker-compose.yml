services: 
  apache:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../../:/workspaces:cached
      - ../php_root:/var/www/html

    working_dir: /workspaces/Totally-Not-A-Virus

    ports:
      - "8080:80"
    networks:
      - backend
    command: 
      - bash
      - -c
      - npm install && exec apache2-foreground
  db:
    image: mariadb:10.4
    restart: unless-stopped
    volumes:
      - mariadb-data:/var/lib/mysql
    env_file: 
      - ../.env
      
    networks:
      - backend

volumes:
  mariadb-data:

networks:
  backend:
