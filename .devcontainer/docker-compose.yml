services: 
  apache:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached
      - ../html/:/var/www/html
    ports:
      - "8080:80"
    networks:
      - backend

  db:
    image: mariadb:10.4
    restart: unless-stopped
    volumes:
      - mariadb-data:/var/lib/mysql
    env_file: 
      - ../.env
      
    networks:
      - backend

volumes:
  mariadb-data:

networks:
  backend:
